<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cruise">
<title>Cruise</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <section id="home" class="screen home">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5.2A2 2 0 0 1 8.4 9.4h7.2a2 2 0 0 1 1.9 1.4L19 16"/><path d="M3.5 16h17v3h-17z"/><circle cx="7.5" cy="13" r=".6" fill="#fff"/><circle cx="16.5" cy="13" r=".6" fill="#fff"/></svg></div>
      <h1>Cruise</h1>
    </div>
    <p class="tag">Draw the route, share a link, and watch every car live. Add stops along the way.</p>
    <div class="card">
      <label>Your name<input id="nick" maxlength="20" placeholder="e.g. Sam" autocomplete="nickname"></label>
      <label>Cruise name<input id="cname" maxlength="40" placeholder="Sunday coast run"></label>
      <button id="startBtn" class="primary">Start a cruise</button>
    </div>
    <div class="divider"><span>or join one</span></div>
    <div class="card row">
      <input id="joinCode" maxlength="8" placeholder="CODE" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn" class="ghost">Join</button>
    </div>
    <p id="homeMsg" class="msg"></p>
  </section>

  <section id="cruise" class="screen" hidden>
    <div id="map"></div>

    <header class="top">
      <button id="backBtn" class="pill icon" aria-label="Leave cruise"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="pill title"><b id="cTitle">Cruise</b><span><i class="dot off" id="liveDot"></i><em id="cSub"></em></span></div>
      <button id="awakeChip" class="pill chip"><i class="dot warn"></i><span>Screen</span></button>
    </header>

    <div id="locating" class="pill locating" hidden>Finding your location…</div>

    <div class="tools" id="tools" hidden>
      <div class="pill seg" id="modeSeg">
        <button data-mode="pan" class="on">Move</button>
        <button data-mode="route">Route</button>
        <button data-mode="stop">Stop</button>
      </div>
      <button id="snapBtn" class="pill small">Roads: On</button>
      <button id="undoBtn" class="pill small">Undo</button>
      <button id="clearBtn" class="pill small">Clear</button>
    </div>
    <div id="hint" class="pill hint" hidden></div>

    <div class="dock">
      <div class="mapctl">
        <button id="zin" class="pill" aria-label="Zoom in">+</button>
        <button id="zout" class="pill" aria-label="Zoom out">−</button>
        <button id="locate" class="pill" aria-label="My location"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <button id="fit" class="pill" aria-label="Fit everything"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="sheet" id="sheet">
        <div class="handle" id="handle"></div>
        <div class="tabs" id="tabs">
          <button data-tab="Route" class="on">Route</button>
          <button data-tab="People">Cruisers</button>
          <button data-tab="Share">Share</button>
        </div>
        <div class="panels">
          <div id="panelRoute" class="panel"></div>
          <div id="panelPeople" class="panel" hidden></div>
          <div id="panelShare" class="panel" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
